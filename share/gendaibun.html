<title>現代文 中間ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
/* Layout: 開くとメニュー（進み具合＋6つの学習ボタン）だけ。ボタンから「1問ずつ解く画面」か「一覧」に入る。教科ごとにアクセント色だけ変える */
:root{
  --accent:#7a5c1e;
  --accent-ink:#ffffff;
  --accent-soft:#efebe4;
  --bg:#f6f7f5;
  --paper:#ffffff;
  --ink:#1c211f;
  --muted:#5f6864;
  --line:#dde2df;
  --ok:#1f7a4d;
  --ok-bg:#e3f3ea;
  --ng:#b3361f;
  --ng-bg:#fbe7e2;
  --star:#9a6a00;
  --sea:#d6e6f0;
  --land:#f1ece0;
  --coast:#8a9389;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-type:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --accent:#e0c27a;--accent-ink:#0f1412;--accent-soft:#3a3a2c;--bg:#121614;--paper:#1a201d;--ink:#e6ebe8;--muted:#9aa49f;--line:#2c3430;
  --ok:#6fd19c;--ok-bg:#183326;--ng:#ff9a85;--ng-bg:#3a1f19;--star:#f2c14e;--sea:#18303b;--land:#3b4038;--coast:#7d877f;color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#e0c27a;--accent-ink:#0f1412;--accent-soft:#3a3a2c;--bg:#121614;--paper:#1a201d;--ink:#e6ebe8;--muted:#9aa49f;--line:#2c3430;
  --ok:#6fd19c;--ok-bg:#183326;--ng:#ff9a85;--ng-bg:#3a1f19;--star:#f2c14e;--sea:#18303b;--land:#3b4038;--coast:#7d877f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー */
header{display:grid;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6.4vw,36px);line-height:1.25;margin:0;text-wrap:balance}
h1 .seg{display:inline-block}
.exam{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--muted)}
.exam strong{color:var(--ink)}
.days{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:4px;padding:1px 8px;font-size:13px}

/* 進み具合 */
.progress{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;font-variant-numeric:tabular-nums;align-items:baseline}
.stats b{font-size:20px}
.s-ok{color:var(--ok)}.s-ng{color:var(--ng)}.s-todo{color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)}.m-ng{background:var(--ng)}

/* メニューのボタン */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:grid;gap:2px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-height:84px;align-content:start}
.mode:hover{border-color:var(--accent)}
.mode .label{font-weight:700;font-size:17px}
.mode .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.primary .sub{color:inherit;opacity:.85}
.mode:disabled{cursor:default;opacity:.5}
.mode.wide{grid-column:1/-1;min-height:0}
.modes.vocab .wide{order:-2}
.modes.vocab .wide.wrong{order:-1}
.modes.simple{gap:12px}
.modes.simple .mode{padding:20px 18px;gap:4px}
.modes.simple .label{font-size:20px}
.mode:disabled:hover{border-color:var(--line)}
.under{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted)}
details summary{cursor:pointer}
details p{margin:6px 0 0;max-width:36em}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.card .link{justify-self:start}
.link:disabled{opacity:.4;cursor:default}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* 画面上部（戻る） */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.back{border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px;background:var(--paper)}
.where{font-weight:700}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;margin:0;text-wrap:balance}

/* 単元・問題数の選択 */
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice .c-title{font-weight:700}
.choice .c-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.choice .meter{grid-column:1/-1;height:5px}
.ghead{font-size:14px;color:var(--muted);margin:10px 0 0;letter-spacing:.04em}
.ghead:first-child{margin-top:0}

/* 1問ずつ解く画面 */
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:14px;min-height:240px;align-content:start}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted);align-items:center}
.badge{border-radius:4px;padding:0 6px;font-size:12px;font-weight:700}
.b-star{color:var(--star);border:1px solid var(--star)}
.b-ng{color:var(--ng);border:1px solid var(--ng)}
.b-ok{color:var(--ok);border:1px solid var(--ok)}
.qtext{font-size:19px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}
.reveal{border:2px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;font-weight:700;cursor:pointer;font-size:16px}
.hintbtn{justify-self:start;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:4px 14px;font-size:14px;cursor:pointer}
.hint{justify-self:start;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 14px;font-size:15px}
.fig{border-radius:8px;overflow:hidden;background:var(--paper)}
.fig svg{display:block;width:100%;height:auto}
.fig svg.fig-tall{max-width:420px;margin:0 auto}
.figpair{display:grid;gap:6px}
@media (min-width:640px){.figpair{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center}}
.fig-sea{fill:var(--sea)}
.fig-land{fill:var(--land);stroke:var(--coast)}
.fig-eq{stroke:var(--coast);fill:none}
.fig-mk{fill:var(--ng);stroke:var(--paper)}
.fig-mkl{fill:var(--ink);stroke:var(--paper);paint-order:stroke;font-weight:700;font-family:var(--f-body)}
.fig-grid{stroke:var(--line);stroke-width:1}
.fig-zero{stroke:var(--muted)}
.fig-bar{fill:var(--accent);opacity:.75}
.fig-line{fill:none;stroke:var(--ng);stroke-width:2}
.fig-dot{fill:var(--ng)}
.fig-ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.fig-cap{fill:var(--ink);font-size:10.5px;font-family:var(--f-body)}
.rows .fig{margin:4px 0;max-width:420px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts:has(.opt:nth-child(4)):not(:has(.opt:nth-child(5))) .opt{min-height:44px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng);color:var(--ng);font-weight:700}
.note{font-size:14px;color:var(--muted);line-height:1.6}
.type{width:100%;font-family:var(--f-type);font-size:22px;font-weight:500;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.type:focus{border-color:var(--accent);outline:none}
.type.ok{border-color:var(--ok);background:var(--ok-bg)}
.type.ng{border-color:var(--ng);background:var(--ng-bg)}
.typebtns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.verdict{border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng)}
.vmark{font-weight:700;font-size:34px;line-height:1}
.vword{font-family:var(--f-type);font-size:22px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.answer{font-size:19px;font-weight:700;background:var(--accent-soft);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{border-radius:10px;padding:14px 8px;font-weight:700;font-size:16px;cursor:pointer;border:2px solid}
.j-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.j-ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 0}
.nav button:disabled{opacity:.35;cursor:default}
.keys{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}

/* 結果 */
.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:grid;gap:12px;text-align:center}
.result .big{font-family:var(--f-display);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.result .stats{justify-content:center}
.actions{display:grid;gap:8px}
.btn{border-radius:10px;padding:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--paper)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* まとめ一覧 */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sheet{display:grid;gap:16px}
.sheet h3{font-size:15px;margin:0 0 6px;color:var(--muted);text-wrap:balance}
.rows{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:2px 8px;padding:9px 12px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .no{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rows .st{color:var(--star)}
.rows .qa{display:grid;gap:2px}
.rows .q{overflow-wrap:anywhere;white-space:pre-line}
.rows .a{font-weight:700;overflow-wrap:anywhere}
.rows .a.hide{color:transparent;background:var(--line);border-radius:4px;cursor:pointer;user-select:none}
.rows li.ok{box-shadow:inset 3px 0 0 var(--ok)}
.rows li.ng{box-shadow:inset 3px 0 0 var(--ng)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
footer{font-size:12px;color:var(--muted);display:grid;gap:2px}
@media (max-width:340px){.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.answer{animation:fade .18s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}
</style>

<script>
const DRILL = {"id": "gendaibun", "course": "二学期中間テスト（高1）・現代文", "title": "現代文 語彙カード　（359〜394）", "exam": "10/26（月）①8:45", "exam_date": "2026-10-26", "source": "現代文の語彙集（論理必修語・論理テーマ）", "updated": "2026-10-25", "group_notes": {"意味→語": "意味を読んで、あてはまる語を4つから選ぶ", "語→意味": "語を見て、正しい意味を4つから選ぶ"}, "vocab": [], "sections": [{"title": "意味→語｜カタカナ語①社会（359〜366）", "group": "意味→語", "items": [{"q": "「伝達。通信。言葉などによる意思や思想の伝達。」を表す語は。", "choices": ["アイロニー", "シニカル", "コミュニケーション", "リテラシー"], "a": "コミュニケーション", "note": "コミュニケーション＝伝達。通信。言葉などによる意思や思想の伝達。　［関：マス・コミュニケーション＝テレビや新聞などの大量伝達（「マスコミ」とも）］", "star": 0, "svg": ""}, {"q": "「読み書き能力。ある分野の情報から必要な物を抜き出し活用する力。」を表す語は。", "choices": ["グロテスク", "リテラシー", "コミュニケーション", "コントラスト"], "a": "リテラシー", "note": "リテラシー＝読み書き能力。ある分野の情報から必要な物を抜き出し活用する力。　［関：メディア・リテラシー］", "star": 0, "svg": ""}, {"q": "「しかけ。装置。機構。機械に似た複雑な仕組みや組織。」を表す語は。", "choices": ["コントラスト", "メカニズム", "コミュニケーション", "ジレンマ"], "a": "メカニズム", "note": "メカニズム＝しかけ。装置。機構。機械に似た複雑な仕組みや組織。　［例：大脳のメカニズムを解明する］", "star": 0, "svg": ""}, {"q": "「偏見。偏向。」を表す語は。", "choices": ["グロテスク", "ジレンマ", "バイアス", "バリエーション"], "a": "バイアス", "note": "バイアス＝偏見。偏向。　［例：バイアスがかかった考え方。関：色眼鏡＝かたよった見方］", "star": 0, "svg": ""}, {"q": "「独裁的な全体主義。」を表す語は。", "choices": ["アポリア", "パラドックス", "グロテスク", "ファシズム"], "a": "ファシズム", "note": "ファシズム＝独裁的な全体主義。　［第一次世界大戦後、イタリアのムッソリーニ政権に始まり、ドイツなど各国に広まった］", "star": 0, "svg": ""}, {"q": "「概念。発想。基本理念。作品や商品の基盤となる見方や考え方。」を表す語は。", "choices": ["観念", "理念", "コンセプト", "概念"], "a": "コンセプト", "note": "コンセプト＝概念。発想。基本理念。作品や商品の基盤となる見方や考え方。　［例：新商品のコンセプト。関：概念＝物事についてのおおよその考え］", "star": 0, "svg": ""}, {"q": "「論法。論理。論理学。」を表す語は。", "choices": ["ロジック", "バリエーション", "バイアス", "アナロジー"], "a": "ロジック", "note": "ロジック＝論法。論理。論理学。　［例：独特のロジックを展開する。関：ロジカル＝論理的であるさま］", "star": 0, "svg": ""}, {"q": "「類似。類推。似ている点をもとに、他のものを推しはかること。」を表す語は。", "choices": ["アナロジー", "バリエーション", "ロジック", "リアリティ"], "a": "アナロジー", "note": "アナロジー＝類似。類推。似ている点をもとに、他のものを推しはかること。　［例：従来の理論のアナロジーから、新現象を説明する］", "star": 0, "svg": ""}]}, {"title": "意味→語｜カタカナ語②芸術（367〜374）", "group": "意味→語", "items": [{"q": "「世間にあまり知られていない興味深い話。挿話。逸話。」を表す語は。", "choices": ["エピソード", "ドラスティック", "パラドックス", "シニカル"], "a": "エピソード", "note": "エピソード＝世間にあまり知られていない興味深い話。挿話。逸話。　［小説や劇の中に挟み込まれる本筋からそれた話や、人や物事に関する興味ある話］", "star": 0, "svg": ""}, {"q": "「現実感。現実性。真実味。」を表す語は。", "choices": ["ドラスティック", "リアリティ", "グロテスク", "アイロニー"], "a": "リアリティ", "note": "リアリティ＝現実感。現実性。真実味。　［関：リアリズム＝現実をありのままに受け入れようとする態度］", "star": 0, "svg": ""}, {"q": "「不気味で異様なさま。奇怪。怪奇。」を表す語は。", "choices": ["ファシズム", "グロテスク", "リアリティ", "ドラスティック"], "a": "グロテスク", "note": "グロテスク＝不気味で異様なさま。奇怪。怪奇。　［もとは古代ローマに始まった装飾模様］", "star": 0, "svg": ""}, {"q": "「思いきったさま。徹底的なさま。抜本的なさま。」を表す語は。", "choices": ["バリエーション", "リアリティ", "ドラスティック", "グロテスク"], "a": "ドラスティック", "note": "ドラスティック＝思いきったさま。徹底的なさま。抜本的なさま。　［「ドラマティック（劇的な）」とは異なるので注意］", "star": 0, "svg": ""}, {"q": "「対照。対比。」を表す語は。", "choices": ["バイアス", "コントラスト", "コンセプト", "メカニズム"], "a": "コントラスト", "note": "コントラスト＝対照。対比。　［映画・テレビ・写真などでは明暗の差のこと］", "star": 0, "svg": ""}, {"q": "「変化。変動。多様性。」を表す語は。", "choices": ["シニカル", "バイアス", "バリエーション", "クレオール"], "a": "バリエーション", "note": "バリエーション＝変化。変動。多様性。　［「ヴァリエーション」とも］", "star": 0, "svg": ""}, {"q": "「皮肉。風刺。反語。」を表す語は。", "choices": ["コントラスト", "シニカル", "アイロニー", "ニヒリズム"], "a": "アイロニー", "note": "アイロニー＝皮肉。風刺。反語。　［関：皮肉＝遠回しの非難・当てこすり。反語＝表面の意味と真の意味を逆にした表現］", "star": 0, "svg": ""}, {"q": "「皮肉な。冷笑的。」を表す語は。", "choices": ["シニカル", "リテラシー", "アナロジー", "アイロニー"], "a": "シニカル", "note": "シニカル＝皮肉な。冷笑的。　［「シニック」とも。関：嘲笑＝あざけり笑うこと］", "star": 0, "svg": ""}]}, {"title": "意味→語｜哲学・思想①（375〜379）", "group": "意味→語", "items": [{"q": "「自分自身。」を表す語は。", "choices": ["自己", "他者", "近代的自我", "観念"], "a": "自己", "note": "自己＝自分自身。　［自己は他者との関わりの中で規定される（論点：他者に規定される自己）］", "star": 1, "svg": ""}, {"q": "「自分とは異なる存在。自分の理解を超えた存在。」を表す語は。", "choices": ["実存", "他者", "近代的自我", "自己"], "a": "他者", "note": "他者＝自分とは異なる存在。自分の理解を超えた存在。　［自己と他者は対立的なものではなく、むしろ他者によって自己が形成される］", "star": 1, "svg": ""}, {"q": "「他者とは異なる自己として認識される自分。」を表す語は。", "choices": ["自己", "他者", "文化", "近代的自我"], "a": "近代的自我", "note": "近代的自我＝他者とは異なる自己として認識される自分。　［「自我」とも。身分の束縛から自由になった近代社会で、自分の存在意義を自ら主体的に問い直そうとする自己意識］", "star": 0, "svg": ""}, {"q": "「目指すべき理想。」を表す語は。", "choices": ["コンセプト", "理念", "観念", "概念"], "a": "理念", "note": "理念＝目指すべき理想。　［例：恒久平和の理念を掲げた憲法］", "star": 0, "svg": ""}, {"q": "「一般性・客観性のある意味内容。」を表す語は。", "choices": ["コンセプト", "観念", "概念", "理念"], "a": "概念", "note": "概念＝一般性・客観性のある意味内容。　［例：英語に「兄」「弟」という概念はない］", "star": 0, "svg": ""}, {"q": "「ある物事についての漠然としたイメージ。」を表す語は。", "choices": ["観念", "コンセプト", "理念", "概念"], "a": "観念", "note": "観念＝ある物事についての漠然としたイメージ。　［観念的＝頭で考えただけで現実味のないさま。例：内容が伴わない観念的な議論］", "star": 0, "svg": ""}, {"q": "「常識に反するように見えて、実は一面の真理を突いた表現。矛盾する事態。」を表す語は。", "choices": ["ジレンマ", "コミュニケーション", "パラドックス", "アポリア"], "a": "パラドックス", "note": "パラドックス＝常識に反するように見えて、実は一面の真理を突いた表現。矛盾する事態。　［「逆説」とも。例：急がば回れ／お金を稼げば稼ぐほどかえって貧乏になる］", "star": 0, "svg": ""}, {"q": "「解きがたい矛盾や難問。」を表す語は。", "choices": ["ドラスティック", "パラドックス", "ジレンマ", "アポリア"], "a": "アポリア", "note": "アポリア＝解きがたい矛盾や難問。　［もとは、ある問題について異なる二つの合理的な見解に直面すること。単に「難問」と押さえておけばよい］", "star": 0, "svg": ""}]}, {"title": "意味→語｜哲学・思想②（380〜384）", "group": "意味→語", "items": [{"q": "「実際に存在すること。主体的に生きる具体的・個別的な存在。」を表す語は。", "choices": ["決定論", "実存", "弁証法", "ニヒリズム"], "a": "実存", "note": "実存＝実際に存在すること。主体的に生きる具体的・個別的な存在。　［近代以降の画一化・均質化された没個性的な人間像への反動として、実存主義で構想された人間観］", "star": 0, "svg": ""}, {"q": "「矛盾しあう事柄を統合することで、より高い次元の認識や結論に至ろうとする思考。」を表す語は。", "choices": ["弁証法", "ニヒリズム", "実存", "決定論"], "a": "弁証法", "note": "弁証法＝矛盾しあう事柄を統合することで、より高い次元の認識や結論に至ろうとする思考。　［例：部活と勉強という矛盾を乗り越え、部活で培った忍耐力で勉強も頑張る］", "star": 0, "svg": ""}, {"q": "「真理や既成の価値観を否定し、あらゆるものを無意味なものとする思想。虚無主義。」を表す語は。", "choices": ["弁証法", "実存", "ニヒリズム", "決定論"], "a": "ニヒリズム", "note": "ニヒリズム＝真理や既成の価値観を否定し、あらゆるものを無意味なものとする思想。虚無主義。　［ニーチェはこの世の虚無性を引き受け、前向きに生きる積極的ニヒリズムを求めた］", "star": 0, "svg": ""}, {"q": "「相反する事柄の間で、どちらを選択しても不利益があるため、決めかねる状態。板挟み。」を表す語は。", "choices": ["ジレンマ", "アポリア", "エピソード", "パラドックス"], "a": "ジレンマ", "note": "ジレンマ＝相反する事柄の間で、どちらを選択しても不利益があるため、決めかねる状態。板挟み。　［例：二匹のヤマアラシ（近づくと互いの針でケガをし、離れると寒くなる）］", "star": 0, "svg": ""}, {"q": "「あらゆる現象は、何らかの外的な原因によってあらかじめ決められているとする立場。」を表す語は。", "choices": ["実存", "決定論", "弁証法", "ニヒリズム"], "a": "決定論", "note": "決定論＝あらゆる現象は、何らかの外的な原因によってあらかじめ決められているとする立場。　［人間の「自由意志」を認める立場と対立する（論点：行為と責任）］", "star": 1, "svg": ""}]}, {"title": "意味→語｜文化①（385〜389）", "group": "意味→語", "items": [{"q": "「人間の精神活動により生まれたもの。」を表す語は。", "choices": ["概念", "多文化主義", "文化", "文明"], "a": "文化", "note": "文化＝人間の精神活動により生まれたもの。　［言語・芸術・習慣などの精神活動に関わり、地域に根ざしている（文明と対比）］", "star": 0, "svg": ""}, {"q": "「高度な技術によって生み出されたもの。」を表す語は。", "choices": ["文化", "文明", "自文化中心主義", "ケ"], "a": "文明", "note": "文明＝高度な技術によって生み出されたもの。　［高度な技術に関わり、普遍性をもつ（文化と対比）］", "star": 0, "svg": ""}, {"q": "「自らの文化の価値を絶対視し、それを他文化にも適用しようとする態度。」を表す語は。", "choices": ["文明", "多文化主義", "自文化中心主義", "文化相対主義"], "a": "自文化中心主義", "note": "自文化中心主義＝自らの文化の価値を絶対視し、それを他文化にも適用しようとする態度。　［エスノセントリズム。「自民族中心主義」とも］", "star": 1, "svg": ""}, {"q": "「どの文化も絶対的なものとせず、多様な文化を尊重すべきとする考え方。」を表す語は。", "choices": ["多文化主義", "文化", "自文化中心主義", "文化相対主義"], "a": "文化相対主義", "note": "文化相対主義＝どの文化も絶対的なものとせず、多様な文化を尊重すべきとする考え方。　［自文化中心主義の対極的な立場。それぞれの文化には固有の価値があり、文化間に優劣はつけられない］", "star": 1, "svg": ""}, {"q": "「一国内・一地域内で複数の文化の対等な共存を評価する立場。」を表す語は。", "choices": ["文化相対主義", "多文化主義", "決定論", "自文化中心主義"], "a": "多文化主義", "note": "多文化主義＝一国内・一地域内で複数の文化の対等な共存を評価する立場。", "star": 0, "svg": ""}, {"q": "「同じ伝統・言語・文化を共有する人間同士が持つ仲間意識。」を表す語は。", "choices": ["コード", "エートス", "エスニシティ", "オリエンタリズム"], "a": "エスニシティ", "note": "エスニシティ＝同じ伝統・言語・文化を共有する人間同士が持つ仲間意識。", "star": 0, "svg": ""}]}, {"title": "意味→語｜文化②（390〜394）", "group": "意味→語", "items": [{"q": "「西洋の人々が東洋の人々を偏った見方で捉えようとする態度。」を表す語は。", "choices": ["エスニシティ", "オリエンタリズム", "コード", "エートス"], "a": "オリエンタリズム", "note": "オリエンタリズム＝西洋の人々が東洋の人々を偏った見方で捉えようとする態度。　［サイードが批判した。西洋人が東洋人に対して抱く〈受動性〉〈官能性〉〈後進性〉などの一方的な見方］", "star": 1, "svg": ""}, {"q": "「植民地支配により、複数の人種・民族が混合して形成された言語や文化。」を表す語は。", "choices": ["クレオール", "エートス", "コード", "エスニシティ"], "a": "クレオール", "note": "クレオール＝植民地支配により、複数の人種・民族が混合して形成された言語や文化。　［「国民国家」の枠組みを超える発想として注目されている］", "star": 0, "svg": ""}, {"q": "「ある社会・文化の人々に共有されている精神性・気風。」を表す語は。", "choices": ["エスニシティ", "オリエンタリズム", "クレオール", "エートス"], "a": "エートス", "note": "エートス＝ある社会・文化の人々に共有されている精神           el("div", { class: "q" }, `${v.en}（${v.pos}）`, still ? null : el("span", { class: "badge b-ok", style: "margin-left:8px" }, "今は○")),
          el("div", { class: "a" }, v.ja)));
    })));
}

/* ── まとめ一覧 ─────────────────────────── */
const view = { unit: -1, hide: false, star: false, ng: false };
function sheet() {
  const chip = (label, on, fn) => el("button", { class: "chip", type: "button", "aria-pressed": String(on), onclick: () => { fn(); sheet(); } }, label);
  const groups = DRILL.sections.map((s, si) => {
    if (view.unit !== -1 && view.unit !== si) return null;
    const list = items.filter(it => it.si === si && (!view.star || it.star) && (!view.ng || everWrong(it)));
    if (!list.length) return null;
    return el("section", null, el("h3", null, s.title),
      el("ol", { class: "rows" }, list.map(it => {
        const a = el("div", { class: "a" + (view.hide ? " hide" : "") }, it.choices && it.note ? `${it.a}　${it.note}` : it.a);
        if (view.hide) a.addEventListener("click", () => a.classList.toggle("hide"));
        return el("li", { class: marks[it.n] || "" },
          el("span", { class: "no" }, it.star ? el("span", { class: "st" }, "★") : null, it.n),
          el("div", { class: "qa" }, el("div", { class: "q" }, it.q), it.svg ? fig(it.svg) : null, a));
      })));
  }).filter(Boolean);
  const y = window.scrollY;
  show(backBar(), el("h2", null, "まとめ一覧"),
    el("div", { class: "filters" },
      chip("全単元", view.unit === -1, () => view.unit = -1),
      DRILL.sections.map((s, si) => chip(`単元${si + 1}`, view.unit === si, () => view.unit = si))),
    el("div", { class: "filters" },
      chip("★だけ", view.star, () => view.star = !view.star),
      chip("一度でも×", view.ng, () => view.ng = !view.ng),
      chip("答えをかくす", view.hide, () => view.hide = !view.hide)),
    view.hide ? el("p", { class: "count", style: "margin:0" }, "かくした答えは、タップすると表示されます。") : null,
    groups.length ? el("div", { class: "sheet" }, groups) : el("p", { class: "empty" }, "あてはまる問題はありません。"));
  window.scrollTo(0, y);
}

home();
</script>
